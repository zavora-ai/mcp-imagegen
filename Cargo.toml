[package]
name = "mcp-imagegen"
version = "0.2.0"
edition = "2024"
authors = ["James Karanja Maina"]
license = "Apache-2.0"
homepage = "https://www.zavora.ai"
repository = "https://github.com/zavora-ai/mcp-imagegen"
rust-version = "1.94.1"
description = "Image-generation MCP server with pluggable backends: local stable-diffusion.cpp and cloud Codex CLI"
keywords = ["mcp", "image-generation", "stable-diffusion", "local-ai"]
categories = ["multimedia::images", "development-tools"]

[features]
default = ["sdcpp", "codex"]
# stable-diffusion.cpp `sd-server` child process over HTTP
sdcpp = ["dep:reqwest"]
# mflux (MLX) CLI subprocess per job
mflux = []
# OpenAI image generation through the Codex CLI (`codex exec`), one subprocess per job
codex = []
# deterministic fake backend for tests and demos
mock = []

[dependencies]
adk-mcp-sdk = { version = "0.3.0", git = "https://github.com/zavora-ai/adk-mcp-sdk.git", rev = "fd08c98466853ae368f0e5f3aae3102dde0bfc35" }
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.1.2", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
anyhow = "1"
thiserror = "2"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"
rand = "0.9"
regex = "1"
base64 = "0.22"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "mcp-imagegen"
path = "src/main.rs"

# Stand-in for the Codex CLI in tests; never installed (needs the `mock` feature).
[[bin]]
name = "fake-codex"
path = "src/bin/fake_codex.rs"
required-features = ["mock"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.47", features = ["full", "test-util"] }
rmcp = { version = "3.1.2", features = ["client", "transport-child-process"] }

[workspace]
